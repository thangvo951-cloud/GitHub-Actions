name: Professional_CI_CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường (Ví dụ .NET, thay bằng Node/Python nếu cần)
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      # Bước 3: Cài đặt các thư viện phụ thuộc
      - name: Restore Dependencies
        run: dotnet restore

      # Bước 4: Biên dịch mã nguồn
      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      # Bước 5: Chạy các bài Test tự động
      - name: Run Tests
        run: dotnet test --no-build --verbosity normal

  deploy:
    # Chỉ chạy deploy nếu build-and-test thành công
    needs: build-and-test
    runs-on: ubuntu-latest
    # Chỉ chạy deploy khi merge vào nhánh chính
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Notify Deployment
        run: echo "Deploying to server..."