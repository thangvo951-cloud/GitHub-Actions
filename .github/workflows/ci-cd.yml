name: Professional_CI_CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      # Bước 3: Giả lập cài đặt (Thay thế dotnet restore)
      - name: Restore
        run: dotnet restore

      # Bước 4: Giả lập biên dịch (Thay thế dotnet build)
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Bước 5: Giả lập chạy Test (Thay thế dotnet test)
      - name: Test
        run: dotnet test --no-build --verbosity normal

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Chạy khi push/merge vào main hoặc develop
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Notify Deployment
        run: echo "Deploying to server completed!"